name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies and build
        run: |
          bun install || npm install --legacy-peer-deps
          bun run build || npx vite build
          
          # Prepare the output directory for GitHub Pages
          mkdir -p dist_pages
          
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist_pages/
          elif [ -d "dist" ]; then
            cp -r dist/* dist_pages/
          fi
          
          # Ensure 404.html exists for SPA routing
          if [ -f "dist_pages/index.html" ]; then
            cp dist_pages/index.html dist_pages/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
