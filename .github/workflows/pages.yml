name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build static pages
        run: |
          npm install --legacy-peer-deps
          if [ -f "scripts/prepare-pages.mjs" ]; then
            node scripts/prepare-pages.mjs || true
          fi
          if [ -f "vite.pages.ts" ]; then
            npx vite build --config vite.pages.ts --base=./
          else
            npx vite build --base=./
          fi
          mkdir -p dist_pages
          if [ -f "dist/index.html" ]; then
            cp -r dist/* dist_pages/
          elif [ -f "dist/static/index.html" ]; then
            cp -r dist/static/* dist_pages/
            cp -r dist/assets dist_pages/ 2>/dev/null || true
          elif [ -d ".output/public" ]; then
            cp -r .output/public/* dist_pages/
          fi
          if [ -f "dist_pages/index.html" ]; then
            cp dist_pages/index.html dist_pages/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
